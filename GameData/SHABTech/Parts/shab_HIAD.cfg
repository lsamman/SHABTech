	description = Nine fabric tori, twenty-four Kevlar straps and a skirt of woven ceramic. It packs into a band around the deck and opens to nearly ten metres, turning a heavy habitat into an extremely expensive shuttlecock. Retracts after landing so the crew can see where they are.
