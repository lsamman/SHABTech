// 16 m hypersonic inflatable decelerator, paper section IV: 9.36 m at HabTech scale, reversible so the
// crew can retract it after landing. Thermal numbers come from stock's InflatableHeatShield, which is
// also a non-ablating fabric shield. Inflated drag comes from ModuleAnimateGeneric's two drag cubes.
// CoPOffset sits behind the stack's centre of mass, about 1.7 m above this part's origin, the same
// trick stock uses to keep a shield-first entry stable.
PART
{
	name = shab_HIAD
	module = Part
	author = lsamman
	MODEL
