// Mars lander deck, paper section IV and the Friz concept: eight CH4/LOX engines firing through the
// open HIAD hub, methalox RCS, six leg nodes. Propellant is LqdMethane:Oxidizer 3:1 like Tundra's Raptors.
// Budget at HabTech mass scale (0.262 x real): landing system 30.39 t real = 7.96 t, this stack with the entry cap is exactly 7.96 t.
// Touchdown mass with the full 5.2 t payload: 5.2 + 1.605 deck + 0.33 legs + 1.05 HIAD = 8.185 t.
// Propellant 3.515 t at 355 s gives 355 * 9.81 * ln(11.70 / 8.185) = 1244 m/s. Mach 3 at Mars is about
// 720 m/s, the 5 s terminal hover about 20 m/s, gravity loss about 200 m/s, leaving about 300 m/s margin.
// Adding the reactor cart, its wheels and the oxygen plant (1.88 t over) drops this to about 1040 m/s: still lands, thin margin.
// Includes a 0.05 t flight computer (about a stock OKTO2), so the deck can fly the vessel with nobody aboard.
