// SHAB habitat module: paper section III. Crew 4, two floors, internal airlock, FIB shell.
// Mass at HabTech scale (0.262 x real), from Table 2's 17.09 t total, without its 0.35 t of crew because KSP adds crew itself.
// Table 1's blanket 0.77 t = 0.20 t and consumables 9.57 t = 2.51 t. The remaining 6.40 t = 1.68 t is this part's mass plus its monopropellant.
PART
{
	name = shab_PCM
	module = Part
	author = lsamman
	MODEL
	{
		model = SHABTech/Parts/shab_PCM
	}
	rescaleFactor = 1
	scale = 1
	// top carries the entry cap, dock seats a docking port in the well in the collar, and both can be used at once
	node_stack_top = 0.0, 1.85, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_dock = 0.0, 1.648, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -1.85, 0.0, 0.0, -1.0, 0.0, 2
	node_attach = 0.0, 0.0, 0.955, 0.0, 0.0, -1.0, 1
	attachRules = 1,1,1,1,0
	TechRequired = spaceExploration
	entryCost = 24000
	cost = 14000
	category = Pods
	subcategory = 0
	title = SH-4 "Longship" Surface Habitat
	manufacturer = SHABTech Consortium
	description = A stretched four-segment cargo module, gutted and refitted for one-way Mars service. The lower floor holds the airlock and suit stowage, and the upper floor is everything else. Stored water and spare furniture line the walls as radiation shielding, so please do not rearrange the water. Choose the quilted FIB blanket for flight, or the bare shields for orbital work.
	mass = 1.44
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 10
	breakingForce = 300
	breakingTorque = 300
	maxTemp = 1400
	skinMaxTemp = 1700
	emissiveConstant = 0.8
	vesselType = Base
	CrewCapacity = 4
	bulkheadProfiles = size1p5, size1
	tags = SHAB Mars surface habitat Cygnus PCM crew hab base airlock FIB

	INTERNAL
	{
		name = shab_PCM_IVA
	}

	MODULE
	{
		name = ModuleDockingNode
		referenceAttachNode = dock
		nodeTransformName = dockingNode
		nodeType = size1
		staged = False
		stagingEnabled = False
	}
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}
	MODULE
	{
		name = ModuleReactionWheel
