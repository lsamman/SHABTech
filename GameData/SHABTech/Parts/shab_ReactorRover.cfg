// 100 kWe power cart (paper III-G). Forward is part +Z; the "drive" control point makes it the default.
// Reactor output is a ModuleResourceConverter, so its heat exists only while it runs and the
// stock ISRU heat model applies: radiators stowed means low efficiency, then auto-shutdown.
// The ModuleGenerator is a small decay-heat trickle that keeps the core awake during transit.
// Nominal 100 kWe real, less cable and conditioning losses, gives 80 EC/s delivered (1 EC/s about 1 kW;
// Near Future Electrical's 0.625 m reactor makes 60 EC/s on the same convention).
PART
{
	name = shab_ReactorRover
	module = Part
	author = lsamman
	MODEL
	{
		model = SHABTech/Parts/shab_ReactorRover
	}
	rescaleFactor = 1
	scale = 1
	node_stack_top = 0.0, 1.095, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_bottom = 0.0, -0.12, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_wheel1 = -0.76, 0.08, 0.60, 0.0, -1.0, 0.0, 0
	node_stack_wheel2 = 0.76, 0.08, 0.60, 0.0, -1.0, 0.0, 0
	node_stack_wheel3 = -0.76, 0.08, -0.60, 0.0, -1.0, 0.0, 0
	node_stack_wheel4 = 0.76, 0.08, -0.60, 0.0, -1.0, 0.0, 0
	node_attach = 0.0, -0.66, 0.0, 0.0, -1.0, 0.0, 1
	fx_gasBurst_white = 0.0, -0.66, 0.0, 0.0, -1.0, 0.0, decouple
	sound_decoupler_fire = decouple
	attachRules = 1,1,1,1,0
	TechRequired = experimentalElectrics
	entryCost = 95000
	cost = 38000
	category = Electrical
	subcategory = 0
	title = KP-100 "Hearthstone" Reactor Cart
	manufacturer = SHABTech Consortium
	description = A 100 kilowatt fission reactor on a golf cart. Blow the tie-downs, drive it well away from the habitat with the shield pointing back at the crew, deploy the radiators, and then start it. It pays out its own power cable as it goes. Stand behind the shield, or better yet, stand somewhere else entirely.
	mass = 1.4
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 12
	breakingForce = 200
	breakingTorque = 200
	maxTemp = 2000
	skinMaxTemp = 2200
	emissiveConstant = 0.90
	heatConductivity = 0.001
	radiatorHeadroom = 0.75
	thermalMassModifier = 2.5
	vesselType = Rover
	bulkheadProfiles = srf
	tags = SHAB reactor nuclear fission power generator rover cart cable Mars Kilopower

	MODULE
