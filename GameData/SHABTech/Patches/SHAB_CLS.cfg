// Connected Living Space: the SH-4 is a pressurised habitat, so kerbals can walk through it.
// Every other SHABTech part is unpressurised and stays off the list.
// The PCM's two stack nodes carry hatches, so both stay passable and no nodes are marked impassable.
@PART[shab_PCM]:HAS[!MODULE[ModuleConnectedLivingSpace]]:NEEDS[ConnectedLivingSpace]
{
	MODULE
	{
		name = ModuleConnectedLivingSpace
		passable = true
	}
}
