// FreeIva support for the SHAB habitat: walk both floors, open the airlock door, climb out.
// Modelled on FreeIva/HabTech2/ht2_genericMedium.cfg. Only applies when FreeIva is installed.
@PART[shab_PCM]:HAS[!MODULE[ModuleFreeIva]]:NEEDS[FreeIva]:AFTER[FreeIva]
{
	MODULE
	{
		name = ModuleFreeIva
	}
}

@INTERNAL[shab_PCM_IVA]:HAS[!MODULE[InternalModuleFreeIva]]:NEEDS[FreeIva]:AFTER[FreeIva]
{
	MODEL
	{
		model = SHABTech/Internals/shab_PCM_IVA_shell
	}

	MODULE
	{
		name = InternalModuleFreeIva
		shellColliderName = shellCollider
		// no depth mask mesh: the windows are real openings in the shell
		internalDepthMaskName =

		Shadows
		{
			shell = TwoSided
			crown = TwoSided
			deck_top = TwoSided
			deck_bot = TwoSided
			floor_low = TwoSided
			bulkhead = TwoSided
		}
	}

	// CBM hatch at the crown connects through the part's top node
	@PROP[htProps_HatchCBM]
	{
		MODULE
		{
			name = HatchConfig
			attachNodeId = top
			hideDoorWhenConnected = true
		}
	}

	// The bulkhead has two door leaves back to back so it looks closed from both sides.
	// FreeIva's hatch opens as a single door, so keep the cabin-side leaf only.
	!PROP[htProps_HatchDoor],1 {}

	// EVA door: a click box on the handwheel, leaving through the part's 'airlock' trigger.
	// Internal coordinates are the part's, negated.
	PROP
	{
		name = FreeIva_Hatch_Invisible_Handle
		position = 0, 0.87, 1.10
		rotation = 1, 0, 0, 0
		scale = 0.26, 0.06, 0.26

		MODULE
		{
			name = HatchConfig
			airlockName = airlock
		}
	}

	// Ladder rungs between the floors and up to the deck hatch, usable as handrails
	PROP
	{
		name = HandRailInvisible
		position = -0.1676, -0.7259, 1.40
		rotation = 0, 0, -0.1132, 0.9936
		scale = 0.2, 0.015, 0.015
	}
	PROP
	{
		name = HandRailInvisible
		position = -0.1676, -0.7259, 0.80
		rotation = 0, 0, -0.1132, 0.9936
		scale = 0.2, 0.015, 0.015
	}
	PROP
	{
		name = HandRailInvisible
		position = -0.1676, -0.7259, 0.20
		rotation = 0, 0, -0.1132, 0.9936
		scale = 0.2, 0.015, 0.015
	}
	PROP
	{
		name = HandRailInvisible
		position = -0.1676, -0.7259, -0.30
		rotation = 0, 0, -0.1132, 0.9936
		scale = 0.2, 0.015, 0.015
	}
}
