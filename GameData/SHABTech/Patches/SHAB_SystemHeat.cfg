// SystemHeat: the folding radiator wing becomes a SystemHeat radiator, shaped after Bluedog's SH_Skylab.cfg.
// Stock figure was 5 kW at the part's 0.1 t, so the curve reaches 5 kW at 400 K.
// The reactor cart is left on the stock core-heat model: its ModuleActiveRadiator is the core radiator
// that keeps the converter from cooking, and SystemHeat has no equivalent for a ModuleCoreHeat part.
@PART[shab_RadiatorWing]:NEEDS[SystemHeat]
{
	MODULE
	{
		name = ModuleSystemHeat
		volume = 0.02
		moduleID = default
		iconName = Icon_Radiator
		ignoreTemperature = true
	}
	@MODULE[ModuleActiveRadiator]
	{
		@name = ModuleSystemHeatRadiator
		moduleID = radiator
		systemHeatModuleID = default
		scalarModuleID = heat
		maxTempAnimation = 500
		usePhysicalTemperatureModeling = false
		maxRadiatorTemperature = 350
		emissivity = 0.9
		temperatureCurve
		{
			key = 0 0
			key = 400 5
		}
		convectiveArea = 1.5
	}
}
