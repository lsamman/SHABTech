// USI Life Support: supplies for the SH-4's four crew, 60 days at about 1 supply per kerbal per day.
// Supplies weigh 0.001 t each, so the water-wall mass in the Consumables Aboard option drops by 0.24 t.
@PART[shab_PCM]:NEEDS[USILifeSupport]:AFTER[USILifeSupport]
{
	%RESOURCE[Supplies]
	{
		%name = Supplies
		%amount = 240
		%maxAmount = 240
	}
	%RESOURCE[Mulch]
	{
		%name = Mulch
		%amount = 0
		%maxAmount = 100
	}
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[consumables]]
	{
		@SUBTYPE[Loaded]
		{
			@addedMass -= 0.24
		}
	}
	@description ^= :$: USI-LS: 240 Supplies, 60 days for four.:
}
