// Waterfall plume for the SM-2 main engine, using a stock Waterfall hypergolic template.
@PART[shab_SM]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!PREFAB_PARTICLE {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = smPlume
		engineID = basicEngine
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = -1,1
		}
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}
		TEMPLATE
		{
			templateName = waterfall-hypergolic-UDMH-NTO-upper-1
			overrideParentTransform = thrustTransform
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 0.22, 0.22, 0.22
		}
	}
}
