// Oxygen plant (paper III-B). Mars is about 96% CO2 by Sol's own PLANETARY_RESOURCE, ResourceType 2.
// Harvester rate, read from ModuleResourceHarvester IL: abundance x Efficiency x atmDensity x (srfSpeed + airSpeedStatic).
// At Sol Mars datum: 0.96 x 333 x 0.0275 kg/m3 x 40 m/s = 352 CO2 units/s. There must be no transform named
// "Intake": with one, a parked vessel's velocity dot product makes the multiplier zero.
// Mass balance, CRP densities (t/unit): CO2 1.951e-6, O2 1.41e-6, LH2 7.085e-5, Water 1e-3, Oxidizer 5e-3.
//   2 CO2 -> 2 CO + O2  : 352.4 CO2/s = 6.875e-4 t/s; O2 is 32/88 of that = 2.500e-4 t/s; CO 4.375e-4 t/s vented.
//     As Oxidizer: 2.500e-4 / 5e-3 = 0.05 units/s.  As Oxygen gas: 2.500e-4 / 1.41e-6 = 177.3 units/s.
//   2 H2 + O2 -> 2 H2O  : 0.05 Water/s = 5.0e-5 t/s; H2 4.032/36.03 = 5.595e-6 t/s = 0.07897 LH2/s;
//     O2 32/36.03 = 4.440e-5 t/s = 31.49 Oxygen/s. In = 5.0e-5 t/s = Out.
PART
{
	name = shab_ISRU
	module = Part
	author = lsamman
	MODEL
	{
		model = SHABTech/Parts/shab_ISRU
	}
	rescaleFactor = 1
	scale = 1
	node_stack_bottom = 0.0, -0.45, 0.0, 0.0, -1.0, 0.0, 1
	node_stack_top = 0.0, 0.40, 0.0, 0.0, 1.0, 0.0, 1
	node_attach = 0.0, -0.45, 0.0, 0.0, -1.0, 0.0, 1
	attachRules = 1,1,1,1,0
	TechRequired = advScienceTech
	entryCost = 22000
	cost = 16000
	category = Utility
	subcategory = 0
	title = OX-1 "Bellows" Oxygen Plant
	manufacturer = SHABTech Consortium
	description = It breathes in Mars, keeps the oxygen, and vents the carbon monoxide up a small chimney. Feed it electricity by the kilowatt and a little imported hydrogen, and it makes liquid oxygen for your return vehicle and water for your crew. It runs at 1100 K, needs its filter mast raised, and works anywhere that has carbon dioxide in the air.
	mass = 0.75
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 8
	breakingForce = 120
	breakingTorque = 120
	maxTemp = 2000
	skinMaxTemp = 2200
	bulkheadProfiles = size1, srf
	tags = SHAB ISRU oxygen oxidizer water atmosphere CO2 harvest plant Mars MOXIE electrolysis

	MODULE
	{
		name = ModuleOverheatDisplay
	}
	MODULE
	{
		name = ModuleResourceHarvester
		HarvesterType = 2
		Efficiency = 333
		ResourceName = CarbonDioxide
		ConverterName = CO2 Intake
		StartActionName = Start CO2 Intake
		StopActionName = Stop CO2 Intake
		ToggleActionName = Toggle CO2 Intake
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 5
		}
	}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Liquid Oxygen
		StartActionName = Start LOX Plant
		StopActionName = Stop LOX Plant
		ToggleActionName = Toggle LOX Plant
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = true
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		UseSpecialistHeatBonus = true
		SpecialistHeatFactor = 0.1
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = CarbonDioxide
			Ratio = 352.4
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 20
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Oxidizer
			Ratio = 0.05
			DumpExcess = false
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Oxygen Gas
		StartActionName = Start O2 Plant
		StopActionName = Stop O2 Plant
		ToggleActionName = Toggle O2 Plant
		AutoShutdown = true
		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1000 10000
			key = 1250 500
			key = 2000 50
			key = 4000 0
		}
		GeneratesHeat = true
		DefaultShutoffTemp = .8
		ThermalEfficiency
		{
			key = 0 0 0 0
			key = 500 0.1 0 0
			key = 1000 1.0 0 0
			key = 1250 0.1 0 0
			key = 3000 0 0 0
		}
		UseSpecialistBonus = false
		EfficiencyBonus = 1
		INPUT_RESOURCE
		{
			ResourceName = CarbonDioxide
			Ratio = 352.4
		}
		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 20
		}
		OUTPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 177.3
			DumpExcess = false
		}
	}
	MODULE
