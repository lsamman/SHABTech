// Wire-mesh rover wheel. Module set copied from stock roverWheelS2, sized for a 0.28 m tyre.
// Mounts from above (node faces +Y), so it lands upright on the rover's underside nodes.
PART
{
	name = shab_RoverWheel
	module = Part
	author = lsamman
	MODEL
	{
		model = SHABTech/Parts/shab_RoverWheel
	}
	rescaleFactor = 1
	scale = 1
	node_stack_top = 0.0, 0.46, 0.0, 0.0, 1.0, 0.0, 0
	node_attach = 0.0, 0.46, 0.0, 0.0, 1.0, 0.0, 0
	attachRules = 1,1,0,1,0
	TechRequired = fieldScience
	entryCost = 1100
	cost = 420
	category = Ground
	subcategory = 0
	title = SR-28 Wire Mesh Wheel
	manufacturer = SHABTech Consortium
	description = Rubber goes brittle on Mars, so this one is woven steel mesh with titanium chevrons riveted on. It cannot go flat, which is the good news. The bad news is that it cannot be patched either. Mount it from above: on the reactor cart's four underside nodes, or on anything else you trust.
	mass = 0.06
	dragModelType = default
	maximum_drag = 0.3
	minimum_drag = 0.2
	angularDrag = 1
	crashTolerance = 20
	breakingForce = 30
	breakingTorque = 30
	maxTemp = 1200
	skinMaxTemp = 1400
	bulkheadProfiles = srf
	tags = SHAB rover wheel drive ground roll mesh Mars

	MODULE
	{
		name = ModuleWheelBase
		wheelColliderTransformName = WheelCollider
		wheelTransformName = WheelPivot
		useNewFrictionModel = true
		wheelType = MOTORIZED
		adherentStart = 0.5
		frictionAdherent = .3
		peakStart = 3
		frictionPeak = 1.5
		limitStart = 6
		frictionLimit = 1.3
		FitWheelColliderToMesh = False
		radius = 0.28
		center = 0,0,0
		mass = 0.040
		groundHeightOffset = 0
		TooltipTitle = Rover Wheel
		TooltipPrimaryField = Motorized
	}
	MODULE
	{
		name = ModuleWheelSuspension
		baseModuleIndex = 0
		suspensionTransformName = SuspensionPivot
		maximumLoad = 8.0
		suspensionDistance = 0.12
		suspensionOffset = -0.03
		targetPosition = 0.3
		springRatio = 24
		damperRatio = 1.0
		useAutoBoost = true
		useDistributedMass = true
	}
	MODULE
	{
		name = ModuleWheelSteering
		baseModuleIndex = 0
		caliperTransformName = SteeringPivot
		autoSteeringAdjust = true
		steeringResponse = 1.5
		steeringRange = 40
		steeringCurve
		{
			key = 0 40
			key = 20 40
		}
		steeringMaxAngleCurve
		{
			key = 0 1 0 0
			key = 1.25 1 -0.007298814 -0.007298814
			key = 5 0.35 -0.0659221 -0.0659221
			key = 15 0.166 -0.006501267 -0.006501267
		}
	}
	MODULE
	{
		name = ModuleWheelMotor
		baseModuleIndex = 0
		wheelSpeedMax = 7
		driveResponse = 2
		torqueCurve
		{
			key = 0 0.28 0 0
			key = 2.5 0.16 0 0
			key = 8 0 0 0
		}
		RESOURCE
		{
			name = ElectricCharge
			rate = 1
		}
		idleDrain = 0.0
	}
	MODULE
	{
		name = ModuleWheelBrakes
		baseModuleIndex = 0
		maxBrakeTorque = 0.5
		brakeResponse = 1
	}
	MODULE
	{
		name = ModuleWheelDamage
		baseModuleIndex = 0
		damagedTransformName = bustedwheel
		undamagedTransformName = wheel
		stressTolerance = 315
		impactTolerance = 65
		deflectionMagnitude = 1.0
		deflectionSharpness = 2.0
		slipMagnitude = 15
		slipSharpness = 2.0
		impactDamageColliderName = collisionEnhancer
		impactDamageVelocity = 13
	}
	MODULE
	{
		name = FXModuleLookAtConstraint
		CONSTRAINLOOKFX
		{
			targetName = armTarget
			rotatorsName = swingArm
		}
		CONSTRAINLOOKFX
		{
			targetName = damperRod
			rotatorsName = damperUpper
		}
		CONSTRAINLOOKFX
		{
			targetName = damperUpper
			rotatorsName = damperRod
		}
	}
	MODULE
	{
		name = ModuleTestSubject
		environments = 15
		useStaging = False
		useEvent = True
	}
	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 250
	}
}
