// A SHABTech tab in the part list, the way HabTech2 does it. Only applies with Community Category Kit.
@CCKExtraFilterConfig:NEEDS[CommunityCategoryKit]
{
	Item
	{
		name = SHABTech
		tag = cck-SHAB
		normalIcon = SHABTech/Icons/shab_icon_inverse
		selectedIcon = SHABTech/Icons/shab_icon
		usedByMod = SHABTech
	}
}
@PART[shab_*]:NEEDS[CommunityCategoryKit]:FOR[SHABTech]
{
	@tags ^= :$: cck-SHAB:
}
