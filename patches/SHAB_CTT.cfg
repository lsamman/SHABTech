// Community Tech Tree: moves the parts whose stock nodes do not exist in CTT onto nodes that do.
// Node ids are the ones other installed mods use in their own CTT patches (SSPXR, Near Future).
// Parts not listed here keep their stock TechRequired, which CTT keeps as well.
@PART[shab_PCM]:NEEDS[CommunityTechTree]:FOR[SHABTech]
{
	@TechRequired = longTermHabitation
}
@PART[shab_Lander]:NEEDS[CommunityTechTree]:FOR[SHABTech]
{
	@TechRequired = colonization
}
@PART[shab_ReactorRover]:NEEDS[CommunityTechTree]:FOR[SHABTech]
{
	@TechRequired = nuclearPower
}
@PART[shab_ISRU]:NEEDS[CommunityTechTree]:FOR[SHABTech]
{
	@TechRequired = advOffworldMining
}
