// TAC Life Support: four crew for 60 days (240 kerbal-days).
// Per kerbal-day rates come from Benjee10's MMSEV patch (4 crew, 10 days): Food 0.365, Water 0.2425,
// Oxygen 37.0, CarbonDioxide 31.97, Waste 0.0325, WasteWater 0.3075.
@PART[shab_PCM]:NEEDS[TacLifeSupport]:AFTER[TacLifeSupport]
{
	%RESOURCE[Food]
	{
		%name = Food
		%amount = 87.6
		%maxAmount = 87.6
	}
	%RESOURCE[Water]
	{
		%name = Water
		%amount = 58.2
		%maxAmount = 58.2
	}
	%RESOURCE[Oxygen]
	{
		%name = Oxygen
		%amount = 8880
		%maxAmount = 8880
	}
	%RESOURCE[CarbonDioxide]
	{
		%name = CarbonDioxide
		%amount = 0
		%maxAmount = 7673
	}
	%RESOURCE[Waste]
	{
		%name = Waste
		%amount = 0
		%maxAmount = 7.8
	}
	%RESOURCE[WasteWater]
	{
		%name = WasteWater
		%amount = 0
		%maxAmount = 73.8
	}
	@description ^= :$: TAC-LS: stores for four kerbals for 60 days.:
}
