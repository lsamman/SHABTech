// Power cable between the reactor cart and the habitat, using Kerbal Attachment System.
// Module and field names come from KAS/Parts/RTS1/part.cfg (source) and KAS/Parts/PortPylonPwr/part.cfg (target).
// A kerbal carries the connector from the cart's fairlead to the socket on the PCM's umbilical plate.
// Link in "dock" mode to merge the two vessels, which lets ElectricCharge flow without pumping.
@PART[shab_ReactorRover]:NEEDS[KAS]:FOR[SHABTech]
{
	MODEL
	{
		model = KAS/Models/CommonConnector/Connector
	}
	MODULE
	{
		name = KASLinkResourceConnector
		linkType = MdHose
		linkTypeDisplayName = #kasLOC_99005
		attachNodeName = kasSrcAuto0
		attachNodeDef = 0.0, 0.195, -0.845, 0.0, 0.0, -1.0, 0
		allowCoupling = true
		jointName = shabCableJoint
		linkRendererName = shabCableRenderer
		coupleMode = SetViaGUI
		sndPathDock = KAS/Sounds/plugdocked
		sndPathUndock = KAS/Sounds/unplugdocked
		connectorMass = 0.01
		sndPathLockConnector = KAS/Sounds/winchSmallLock
		sndPathDockConnector = KAS/Sounds/plugdocked
		sndPathGrabConnector = KAS/Sounds/grab
		sndPathPlugConnector = KAS/Sounds/plug
		sndPathUnplugConnector = KAS/Sounds/unplug
		sndPathBroke = KAS/Sounds/broke
		maxTransferSpeed = 20.0
		autoSpeedTransferDuration = 4
		rotatingWinchCylinderModel = *shab_ReactorRover*/model/cable_drum
		cylinderPerimeterLength = 0.848
		resourceOverride = +ElectricCharge
	}
	MODULE
	{
		name = KASRendererPipe
		rendererName = shabCableRenderer
		pipeTextureRescaleMode = TileFromTarget
		pipeDiameter = 0.07
		pipeTexturePath = KAS/Textures/hose-d70-1kn
		pipeNormalsTexturePath = KAS/Textures/hose-d70-1knNRM
		pipeTextureSamplesPerMeter = 1
		sourceJoint
		{
			sphereDiameter = 0.07
		}
		targetJoint
		{
			sphereDiameter = 0.07
			model = *CommonConnector*/head
			modelPartAttachAt = 0,0,0,  180,0,0
			modelPipeAttachAt = 0,0,0.15,  0,0,0
			parkAttachAt = 0,0.195,-0.805,  0,180,0
		}
	}
	MODULE
	{
		name = KASJointCableBase
		jointName = shabCableJoint
		anchorAtTarget = 0, 0, 0.1490
		maxLinkLength = 150
		linkBreakForce = 0
		cableSpringForce = 1
		cableSpringDamper = 0
	}
}

// Socket on the PCM's umbilical plate at azimuth 60, z -1.26. It faces (0.866, 0, -0.5) in part space.
@PART[shab_PCM]:NEEDS[KAS]:FOR[SHABTech]
{
	MODEL
	{
		model = KAS/Models/Port1/model
		position = 0.8413, -1.26, -0.4858
		rotation = 90, 120, 0
	}
	MODULE
	{
		name = KASLinkTargetBase
		linkType = MdHose
		linkTypeDisplayName = #kasLOC_99005
		attachNodeName = shabPowerPort
		attachNodeDef = 0.8727, -1.26, -0.5039, 0.866, 0.0, -0.5, 0
		allowCoupling = true
	}
}
