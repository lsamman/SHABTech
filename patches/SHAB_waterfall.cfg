// Waterfall plumes for the ML-8 lander deck's eight descent engines.
@PART[shab_Lander]:NEEDS[Waterfall]
{
	@EFFECTS
	{
		@running
		{
			!MODEL_MULTI_PARTICLE {}
		}
	}
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = descentPlume
		engineID = descent
		CONTROLLER
		{
			name = random
			linkedTo = random
			range = -1,1
		}
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}
		TEMPLATE
		{
			templateName = waterfall-methalox-upper-raptor-1
			overrideParentTransform = thrustTransform
			position = 0, 0, 0
			rotation = 0, 0, 0
			scale = 0.34, 0.34, 0.34
		}
	}
}
